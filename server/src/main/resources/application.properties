server.port=${SERVER_PORT:9090}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:15173,http://127.0.0.1:15173}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/quvideo_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=3000
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
spring.mvc.async.request-timeout=${AI_INTERACTIVE_TIMEOUT_MS:180000}
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=0

# Upload
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB

# Local media tools
tool.ytdlp.path=${YTDLP_PATH:yt-dlp}
tool.ffmpeg.dir=${FFMPEG_DIR:}
tool.ocr.command=${OCR_COMMAND:tesseract}

